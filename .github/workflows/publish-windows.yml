name: Create GitHub release

run-name: Release v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v (for example, 0.1.0 or 1.0.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark this as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SELECTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:SELECTED_REF -ne $env:DEFAULT_BRANCH) {
            throw "Releases must be created from the default branch '$env:DEFAULT_BRANCH'; selected '$env:SELECTED_REF'."
          }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Version must be SemVer without a leading v, for example 0.1.0 or 1.0.0-rc.1."
          }
          $tag = "v$env:RELEASE_VERSION"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tags." }
          if ($existingTag) { throw "Tag $tag already exists." }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Build, test, and publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          ./scripts/build.ps1
          -Publish
          -PublishDirectory "artifacts/package/Dolphin TAS Studio"
          -Version $env:RELEASE_VERSION

      - name: Verify and package distribution
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $publishDirectory = 'artifacts/package/Dolphin TAS Studio'
          $required = @(
            "$publishDirectory/TasStudio.App.exe",
            "$publishDirectory/TasStudio.Worker.exe",
            "$publishDirectory/native/TasStudio.LibretroHost.dll",
            "$publishDirectory/native/dolphin_libretro.dll",
            "$publishDirectory/system/dolphin-emu/Sys",
            "$publishDirectory/NOTICE.md",
            "$publishDirectory/LICENSE"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Published distribution is missing $path"
            }
          }

          $releaseDirectory = New-Item -ItemType Directory -Force -Path 'artifacts/release'
          $archiveName = "Dolphin-TAS-Studio-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path $releaseDirectory.FullName $archiveName
          Compress-Archive -LiteralPath $publishDirectory -DestinationPath $archivePath -CompressionLevel Optimal

          $checksumPath = "$archivePath.sha256"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive_path }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum_path }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $arguments = @(
            'release', 'create', $tag,
            $env:RELEASE_ARCHIVE,
            $env:RELEASE_CHECKSUM,
            '--target', $env:GITHUB_SHA,
            '--title', "Dolphin TAS Studio $env:RELEASE_VERSION",
            '--generate-notes'
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Creating GitHub Release $tag failed." }

          $releaseUrl = gh release view $tag --json url --jq .url
          "### Published [$tag]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
