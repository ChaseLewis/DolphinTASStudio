name: Create GitHub release

run-name: Release v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v (0.2.0, 0.2.0-beta.1, or 0.2.0-alpha.1)
        required: true
        type: string
      channel:
        description: Update channel (must match the version suffix)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SELECTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:SELECTED_REF -ne $env:DEFAULT_BRANCH) {
            throw "Releases must be created from the default branch '$env:DEFAULT_BRANCH'; selected '$env:SELECTED_REF'."
          }
          ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Channel $env:RELEASE_CHANNEL -ValidateOnly
          $tag = "v$env:RELEASE_VERSION"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing tags." }
          if ($existingTag) { throw "Tag $tag already exists." }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Build, test, and publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          ./scripts/build.ps1
          -Publish
          -PublishDirectory "artifacts/package/Dolphin TAS Studio"
          -Version $env:RELEASE_VERSION

      - name: Verify and package distribution
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Channel $env:RELEASE_CHANNEL

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release' -File | Where-Object {
            $_.Extension -in @('.exe', '.zip', '.nupkg') -or
            $_.Name -eq "releases.win-x64-$env:RELEASE_CHANNEL.json" -or $_.Name -eq 'SHA256SUMS.txt'
          } | ForEach-Object FullName)
          $arguments = @(
            'release', 'create', $tag
          ) + $assets + @(
            '--target', $env:GITHUB_SHA,
            '--title', "Dolphin TAS Studio $env:RELEASE_VERSION",
            '--generate-notes'
          )
          if ($env:RELEASE_CHANNEL -ne 'stable') { $arguments += @('--prerelease', '--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Creating GitHub Release $tag failed." }

          $releaseUrl = gh release view $tag --json url --jq .url
          "### Published [$tag]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
